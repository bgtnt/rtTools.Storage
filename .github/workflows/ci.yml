name: Verify package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Europe/Sofia
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.4xx'
      - name: Set Windows regression timezone
        if: runner.os == 'Windows'
        shell: pwsh
        run: tzutil /s "FLE Standard Time"
      - name: Build, pack and verify package-only consumers
        shell: pwsh
        run: ./verify.ps1
